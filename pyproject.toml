[project]
name = "ray-serve-cai-bench"
version = "0.1.0"
description = "Stress testing suite for ray-serve-cai endpoints"
requires-python = ">=3.11"
dependencies = [
    "locust>=2.29",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.13.0"]
text2sql = ["openai>=1.0", "datasets>=2.14"]

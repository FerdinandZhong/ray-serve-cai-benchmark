# ray-serve-cai-bench: CAI Configuration
#
# Jobs:  setup_environment (installs deps into venv)
# Applications: Locust YOLO / vLLM web UIs (accessible via CAI Applications tab)
#
# Usage:
#   python3 cai_integration/create_jobs.py --project-id $CML_PROJECT_ID
#   python3 cai_integration/create_applications.py --project-id $CML_PROJECT_ID
#   python3 cai_integration/trigger_jobs.py --project-id $CML_PROJECT_ID

runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2026.01.1-b6"

jobs:
  # ── Environment Setup (run once before starting applications) ──────────
  setup_environment:
    name: "Benchmark - Setup Environment"
    script: "cai_integration/setup_environment.py"
    kernel: "python3"
    cpu: 4
    memory: 8
    gpu: 0
    timeout: 1800
    parent_job_key: null
    environment:
      FORCE_REINSTALL: "false"

  # ── Text-to-SQL Accuracy Benchmark (Spider) ─────────────────────────────
  # Evaluates model SQL generation via execution accuracy.
  # Set INFERENCE_URL to the OpenAI-compatible endpoint in CAI UI.
  text2sql_benchmark:
    name: "Benchmark - Text2SQL Accuracy (Spider)"
    script: "cai_integration/run_text2sql_benchmark.py"
    kernel: "python3"
    cpu: 4
    memory: 8
    gpu: 0
    timeout: 7200
    parent_job_key: setup_environment
    environment:
      INFERENCE_URL: ""
      MODEL_NAME: "default"
      MAX_SAMPLES: "0"
      CONCURRENCY: "4"
      TIMEOUT: "60"
      TEMPERATURE: "0.0"

applications:
  # ── Locust YOLO Application ────────────────────────────────────────────
  # Interactive web UI for YOLO object detection load testing.
  # Set INFERENCE_URL in the CAI UI when starting the application.
  locust_yolo:
    name: "Locust YOLO Benchmark"
    subdomain: "locust-yolo"
    description: "Locust load testing UI for YOLO object detection endpoints"
    script: "cai_integration/deploy_locust_app.py"
    kernel: "python3"
    cpu: 4
    memory: 8
    gpu: 0
    bypass_authentication: true
    environment:
      LOCUST_FILE: "locust/locustfile_yolo.py"
      INFERENCE_URL: ""
      YOLO_ROUTE: "/v1/detect"
      DATASET_DIR: "datasets/sample_images"
      LOCUST_USERS: "10"
      LOCUST_RATE: "5"

  # ── Locust vLLM Application ────────────────────────────────────────────
  # Interactive web UI for vLLM chat completion load testing.
  # Set INFERENCE_URL in the CAI UI when starting the application.
  locust_vllm:
    name: "Locust vLLM Benchmark"
    subdomain: "locust-vllm"
    description: "Locust load testing UI for vLLM chat completion endpoints"
    script: "cai_integration/deploy_locust_app.py"
    kernel: "python3"
    cpu: 4
    memory: 8
    gpu: 0
    bypass_authentication: true
    environment:
      LOCUST_FILE: "locust/locustfile_chat.py"
      INFERENCE_URL: ""
      VLLM_ROUTE: "/qwen-2b"
      VLLM_MODEL: "/home/cdsw/models/Qwen3.5-2B"
      LOCUST_USERS: "10"
      LOCUST_RATE: "5"
